<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Transparent background for light luxury aesthetic -->
  <defs>
    <!-- Carmine Red Gradient -->
    <linearGradient id="xnoxRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1838" />
      <stop offset="100%" stop-color="#D00825" />
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, -10)">
    <!-- Interlocking Geometric Red 'X' Emblem -->
    <!-- Back stroke / left-to-right diagonal arm -->
    <polygon points="175,90 225,90 325,270 275,270" fill="url(#xnoxRedGrad)" />
    <!-- Front stroke / right-to-left diagonal arm with interlocking hollow cutout -->
    <polygon points="325,90 275,90 175,270 225,270" fill="url(#xnoxRedGrad)" />
    
    <!-- Central interlocking cutout geometry matching the official badge -->
    <polygon points="250,155 220,205 250,255 280,205" fill="#FFFFFF" opacity="0.95" />
    <polygon points="250,170 232,205 250,238 268,205" fill="url(#xnoxRedGrad)" />

    <!-- XNOX Wordmark in Stately Luxury Obsidian Charcoal -->
    <text x="250" y="375" 
          text-anchor="middle" 
          font-family="'Playfair Display', 'Cinzel', 'Times New Roman', serif" 
          font-size="78" 
          font-weight="800" 
          letter-spacing="14" 
          fill="#141518">
      XNOX
    </text>

    <!-- HOTEL EXPERIENCE Subtitle in Refined Gold-accented Sans-Serif -->
    <text x="250" y="420" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="19" 
          font-weight="700" 
          letter-spacing="8.5" 
          fill="#B88E3E">
      HOTEL EXPERIENCE
    </text>

    <!-- Subtle accent line under subtitle -->
    <rect x="210" y="440" width="80" height="2" fill="#D00825" rx="1" />
  </g>
</svg>
